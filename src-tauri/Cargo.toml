[package]
name = "flight-recorder"
version = "0.1.0"
description = "Practise job interviews on webcam, entirely on your own machine."
authors = ["ei-sei"]
edition = "2021"
repository = "https://github.com/ei-sei/flight-recorder"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "flight_recorder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "image-png", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-fs = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Local speech-to-text for the WPM feature, on every platform. Windows used
# to be excluded here and use the browser's SpeechRecognition API instead,
# which meant it was the one place the app sent audio off-device. Running
# whisper everywhere costs Windows a C++ build and a few MB of binary, and
# buys back an unconditional "nothing leaves this machine", one code path
# instead of two, and WPM numbers that mean the same thing on every OS.
whisper-rs = "0.16"
# symphonia and rubato used to live here, to demux and resample the recording
# on this side. They are gone because that could never work: Chromium's MP4
# muxer omits the esds SLConfigDescriptor that symphonia's isomp4 reader
# treats as mandatory, so every WebView2 recording failed to demux, and
# symphonia has no Opus decoder so the WebM fallback failed too. The webview
# can always decode the file it just wrote, so the decode happens there and
# whisper.rs reads plain 16kHz f32 PCM.
ureq = { version = "2", features = ["tls"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Raw bindings to the same WebKitGTK build wry already links against here -
# "2" resolves to whatever wry's own webkit2gtk-rs pin already put in
# Cargo.lock (2.0.2 as of writing), so this doesn't introduce a second,
# possibly-incompatible copy. Needed because Tauri's own API has no
# cross-platform way to answer a camera/mic permission request - only Linux
# requires the embedding app to answer one at all, so reaching past Tauri to
# the raw webview is unavoidable here. v2_40 is a cumulative feature flag in
# this binding crate, not a version requirement on the system's WebKitGTK
# (which only needs to be at least that old) - it just gates how much of the
# API surface the Rust bindings expose.
webkit2gtk = { version = "2", features = ["v2_40"] }

