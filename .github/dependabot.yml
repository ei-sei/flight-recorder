version: 2
updates:
  # The speech helper. Its GTK/glib-era ignore went with Tauri: nothing here
  # links GTK any more.
  - package-ecosystem: "cargo"
    directory: "/native"
    schedule:
      interval: "weekly"

  # Includes Electron itself, which ships Chromium: only its latest three
  # major versions get security fixes, so these updates are worth taking
  # promptly rather than batching up.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
