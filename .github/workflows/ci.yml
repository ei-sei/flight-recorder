name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only the newest commit on a branch is worth checking. Pushing twice in
# quick succession used to leave the first run grinding through a full
# Windows whisper.cpp build (~7 minutes) whose result nobody would look at.
# Grouped by ref so branches and PRs never cancel each other.
# Neither job writes anything back to the repository. Without this block they
# inherit the repository default, which on an older repo is read/write on
# contents - release.yml already scopes its own token per job.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      # The Rust side is ~50 lines; essentially all of this app's logic lives
      # in src/js. Without this, a syntax error there ships to a release
      # completely unchecked. No dependencies needed - node parses the files.
      - name: syntax-check frontend JavaScript
        run: |
          for f in src/js/*.js; do
            node --check "$f"
          done

      # Node's own runner, no dependencies. Covers the pure functions in
      # util.js, which are where every number this app presents as fact is
      # actually computed - a syntax check says nothing about whether the WPM
      # or the pace spread is right.
      - name: unit tests
        run: npm test

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # cmake/build-essential/libclang-dev are for whisper-rs (local
      # speech-to-text, every platform now) - its build script compiles
      # whisper.cpp and needs bindgen, which needs libclang.
      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf cmake build-essential libclang-dev

      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # whisper-rs-sys's build script only re-runs when its wrapper.h
          # changes, so a cached whisper.cpp survives CMake option changes.
          # Bumping this key forces one cold rebuild whenever those options
          # change (last: GGML_NATIVE off, see src-tauri/ggml-portable.cmake).
          key: portable-ggml-2
          # A clippy or fmt failure shouldn't throw away a full dependency
          # build - the next push would otherwise start cold.
          cache-on-failure: true

      # Every cargo step runs from src-tauri/, not the repo root with
      # --manifest-path. Cargo finds .cargo/config.toml by walking up from the
      # current directory, not from the manifest, so from the root it never
      # loaded src-tauri/.cargo/config.toml - and CI silently built something
      # different from the release. `tauri build` always runs cargo from
      # src-tauri/, so this is what makes CI build what actually ships.
      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --no-deps -- -D warnings

      - name: cargo build
        working-directory: src-tauri
        run: cargo build

      # See .github/scripts/check-no-avx512.sh. release.yml runs the same
      # check against the real release binary.
      - name: whisper.cpp contains no AVX-512
        run: .github/scripts/check-no-avx512.sh src-tauri/target/debug/flight-recorder

  # Windows gets its own job purely because whisper.cpp's build is the one
  # part of this repo that breaks differently per platform, and it used to
  # break only on a release tag - which is a terrible place to find out.
  # fmt/clippy aren't repeated here; they're platform-independent.
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Must match release.yml's setup exactly, or this job stops predicting
      # what a release will do, which is its whole reason to exist.
      - name: set up libclang for bindgen
        shell: pwsh
        run: |
          choco install llvm --version=18.1.8 -y --allow-downgrade --no-progress
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-portable-ggml-2
          cache-on-failure: true

      # From src-tauri/ so .cargo/config.toml is loaded - see lint-and-build.
      - name: cargo build
        working-directory: src-tauri
        run: cargo build
