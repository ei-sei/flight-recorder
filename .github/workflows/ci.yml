name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only the newest commit on a branch is worth checking. Pushing twice in
# quick succession used to leave the first run grinding through a full
# Windows whisper.cpp build (~7 minutes) whose result nobody would look at.
# Grouped by ref so branches and PRs never cancel each other.
# No job writes anything back to the repository. Without this block they
# inherit the repository default, which on an older repo is read/write on
# contents - release.yml already scopes its own token per job.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      # Essentially all of this app's logic is JavaScript. Without this, a
      # syntax error ships to a release completely unchecked.
      - name: syntax-check JavaScript
        run: |
          for f in src/js/*.js electron/*.js scripts/*.js test/e2e/*.js; do
            node --check "$f"
          done

      - name: install dependencies
        run: npm ci

      # Node's own runner. Covers the pure functions in util.js (where every
      # number the app presents as fact is computed), the main process's
      # path checks, protocols and speech-engine handling, and the update
      # signature checks.
      - name: unit tests
        run: npm test

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # cmake/build-essential/libclang-dev build the speech helper (whisper.cpp
      # plus bindgen). xvfb, espeak-ng and ffmpeg are for the end-to-end test:
      # a display to run in, and a spoken sentence for the fake microphone.
      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libclang-dev xvfb espeak-ng ffmpeg

      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          # whisper-rs-sys's build script only re-runs when its wrapper.h
          # changes, so a cached whisper.cpp survives CMake option changes.
          # Bump this key whenever those options change (native/ggml-portable.cmake).
          key: electron-1
          # A clippy or fmt failure shouldn't throw away a full dependency
          # build - the next push would otherwise start cold.
          cache-on-failure: true

      # Every cargo step runs from native/, not the repo root with
      # --manifest-path. Cargo finds .cargo/config.toml by walking up from
      # the current directory, not from the manifest - from the root it would
      # never load native/.cargo/config.toml, and CI would silently build
      # something different from the release (whisper.cpp tuned to this
      # runner's CPU). Release profile throughout, so these share one build
      # of whisper.cpp with the helper below.
      - name: cargo fmt --check
        working-directory: native
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: native
        run: cargo clippy --release --no-deps -- -D warnings

      - name: build the speech helper
        run: node scripts/build-helper.js

      # See .github/scripts/check-no-avx512.sh. release.yml runs the same
      # check against the helper it packages.
      - name: whisper.cpp contains no AVX-512
        run: .github/scripts/check-no-avx512.sh native/target/release/fr-whisper

      # Cached by its hash, so the 60MB download happens once rather than on
      # every push, and checked against that hash either way.
      - name: cache the speech model
        uses: actions/cache@v6
        with:
          path: ~/.cache/fr-e2e-model
          key: whisper-model-4baf70dd0d7c4247

      - name: fetch the speech model
        run: |
          model=~/.cache/fr-e2e-model/ggml-base.en-q5_1.bin
          if [ ! -f "$model" ]; then
            mkdir -p "$(dirname "$model")"
            curl -fsSL -o "$model" https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en-q5_1.bin
          fi
          echo "4baf70dd0d7c4247ba2b81fafd9c01005ac77c2f9ef064e00dcf195d0e2fdd2f  $model" | sha256sum -c

      # The whole path through the real UI - record, save, transcribe, play
      # back, and no network traffic - with Chromium's fake camera and an
      # espeak sentence as the microphone. See test/e2e/record.e2e.js.
      - name: end-to-end test
        run: FR_E2E_MODEL=~/.cache/fr-e2e-model/ggml-base.en-q5_1.bin xvfb-run -a npm run test:e2e

      # Updates only run in an installed build, so the end-to-end test can't
      # see what they touch. This runs the real AppImage on a fresh profile
      # and fails on any request but the update check - it's where
      # electron-updater's own session was found fetching a spellcheck
      # dictionary from Google. See scripts/check-network.js.
      - name: installed app only contacts GitHub, for updates
        run: |
          npx electron-builder --linux AppImage --publish never
          xvfb-run -a node scripts/check-network.js dist/*.AppImage

  # Windows and macOS each get their own job for two reasons. whisper.cpp's
  # build is the part of this repo that breaks differently per platform, and
  # it used to break only on a release tag - a terrible place to find out.
  # And each runs the end-to-end test, which there checks that recordings
  # come out as H.264 + AAC (Linux Chromium has no AAC encoder, so it can't).
  # fmt/clippy aren't repeated; they're platform-independent.
  other-platforms:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Must match release.yml's setup exactly, or this job stops predicting
      # what a release will do, which is its whole reason to exist.
      - name: set up libclang for bindgen (windows only)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          choco install llvm --version=18.1.8 -y --allow-downgrade --no-progress
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: install CMake (macos only)
        if: matrix.platform == 'macos-latest'
        run: brew install cmake

      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: ${{ matrix.platform }}-electron-1
          cache-on-failure: true

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: install dependencies
        run: npm ci

      - name: build the speech helper
        env:
          CMAKE_OSX_DEPLOYMENT_TARGET: "10.15"
        run: node scripts/build-helper.js

      - name: end-to-end test
        run: npm run test:e2e
