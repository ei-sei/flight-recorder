name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      # The Rust side is ~50 lines; essentially all of this app's logic lives
      # in src/js. Without this, a syntax error there ships to a release
      # completely unchecked. No dependencies needed - node parses the files.
      - name: syntax-check frontend JavaScript
        run: |
          for f in src/js/*.js; do
            node --check "$f"
          done

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # cmake/build-essential/libclang-dev are for whisper-rs (macOS/Linux-only
      # local speech-to-text) - its build script compiles whisper.cpp and
      # needs bindgen, which needs libclang. Not needed on Windows, so not
      # added there.
      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf cmake build-essential libclang-dev

      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo fmt --check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --no-deps -- -D warnings

      - name: cargo build
        run: cargo build --manifest-path src-tauri/Cargo.toml
