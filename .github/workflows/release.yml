name: Release

on:
  push:
    tags:
      - "v*"

# cancel-in-progress is deliberately FALSE here, unlike CI. Killing a
# release part-way through leaves a draft holding some platforms' installers
# and not others - which is the same shape as the v1.0.8 failure noted
# below, and far worse than wasting a few runner minutes.
#
# Grouped by ref rather than by workflow, so it only guards against the same
# tag building twice at once (re-pushing a moved tag, say) where both runs
# would upload into the same draft. Two different tags stay independent:
# they write to separate releases, and queuing them behind each other could
# silently drop one, since GitHub only holds a single pending run per group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Need full history and tags to diff against the previous release -
          # a shallow checkout wouldn't have the earlier tag to compare from.
          fetch-depth: 0
          fetch-tags: true

      # GitHub's own generate_release_notes only summarizes merged pull
      # requests - this repo pushes straight to main, so it produced an
      # empty "What's Changed" (just a bare compare link) every time. Build
      # real notes from the commit log instead, since that's what actually
      # exists in this workflow.
      - name: build release notes from commit log
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep -vFx "$GITHUB_REF_NAME" | head -1)
          if [ -n "$PREV_TAG" ]; then
            {
              echo "## What's Changed"
              # --right-only --cherry-pick over the three-dot range, not a
              # plain two-dot log. If history is ever rewritten after a tag is
              # published, that tag points off the current branch and a two-dot
              # range re-lists every rewritten commit as though it were new -
              # v1.2.0 is exactly that case. Comparing by patch id instead of
              # by commit id drops the ones that already shipped.
              git log --right-only --cherry-pick --no-merges \
                "$PREV_TAG...$GITHUB_REF_NAME" --pretty=format:'- %s'
              echo ""
              echo ""
              echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$PREV_TAG...$GITHUB_REF_NAME"
            } > notes.md
          else
            echo "Initial release." > notes.md
          fi

      - name: create draft release
        id: create
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # body=@notes.md reads the field value from the file, rather than
          # interpolating commit messages into the shell command - avoids
          # any risk of a commit subject containing shell-meaningful
          # characters breaking or injecting into this command. The @path
          # file-read syntax is only honoured by -F (typed field), not -f
          # (raw string) - using -f here sent the literal string "@notes.md"
          # instead of the file's contents.
          RESPONSE=$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
            -f "tag_name=${GITHUB_REF_NAME}" \
            -f "name=Flight recorder v${VERSION}" \
            -F "body=@notes.md" \
            -F draft=true \
            -F prerelease=false)
          echo "id=$(echo "$RESPONSE" | jq -r .id)" >> "$GITHUB_OUTPUT"

  release:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # One macOS leg builds both architectures, so electron-builder
          # writes a single latest-mac.yml listing both - two legs would each
          # write their own and one would overwrite the other.
          - platform: "macos-latest"
            electron: "--mac"
            helper: "x86_64-apple-darwin aarch64-apple-darwin"
          - platform: "ubuntu-22.04"
            electron: "--linux"
            helper: ""
          - platform: "windows-latest"
            electron: "--win"
            helper: ""

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # cmake/build-essential/libclang-dev are for the speech helper - its
      # build compiles whisper.cpp and needs bindgen, which needs libclang.
      # rpm is for electron-builder's .rpm target.
      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libclang-dev rpm

      # The speech helper needs CMake to build whisper.cpp - Xcode's command
      # line tools (already on macos-latest runners) cover the C++ side.
      - name: install dependencies (macos only)
        if: startsWith(matrix.platform, 'macos')
        run: brew install cmake

      # Windows runners ship LLVM and CMake, but bindgen doesn't find libclang
      # on its own here - a long-standing runner-image quirk - so point it at
      # the install explicitly rather than hoping. Pinned to a known LLVM
      # rather than "whatever's on PATH": the image's version drifts between
      # runs, and a clang older than the MSVC headers it's parsing fails.
      - name: set up libclang for bindgen (windows only)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          choco install llvm --version=18.1.8 -y --allow-downgrade --no-progress
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          # Per platform, since each builds different targets. Bump the
          # suffix whenever whisper.cpp's CMake options change: its build
          # script only re-runs when wrapper.h changes, so a cached build
          # keeps whatever flags it was first compiled with.
          key: ${{ matrix.platform }}-electron-1
          # Saves the cache even when the build fails. GitHub scopes cache
          # reads to the current ref, so a tag's cache is only ever readable
          # by another run on that same tag - which is exactly what a retry
          # is. Without this a failed release leg saves nothing and the retry
          # recompiles whisper.cpp from scratch.
          cache-on-failure: true

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      # npm ci, not npm install - a release build should install exactly what
      # package-lock.json pins rather than being free to resolve something
      # newer than what CI tested.
      - name: install dependencies
        run: npm ci

      - name: build the speech helper
        env:
          # whisper.cpp uses std::filesystem APIs that Apple's libc++ gates
          # behind macOS 10.15 - without an explicit deployment target the
          # compiler treats them as unavailable and the build fails. No-op on
          # Linux/Windows. Has to be this exact name, not
          # MACOSX_DEPLOYMENT_TARGET: whisper-rs-sys's build.rs only forwards
          # env vars prefixed "CMAKE_" to cmake.
          CMAKE_OSX_DEPLOYMENT_TARGET: "10.15"
        run: node scripts/build-helper.js ${{ matrix.helper }}

      # Scans the helper that is about to be packaged. Linux only: it needs
      # objdump and an ELF binary. The other platforms compile whisper.cpp
      # under the same GGML_NATIVE=OFF setting.
      - name: whisper.cpp contains no AVX-512
        if: matrix.platform == 'ubuntu-22.04'
        run: .github/scripts/check-no-avx512.sh native/dist/x64/fr-whisper

      # The Visual C++ runtime has to be linked in (native/.cargo/config.toml),
      # or the helper fails on any Windows machine that hasn't installed the
      # redistributable - which a runner always has, so it wouldn't show here.
      - name: speech helper needs no Visual C++ runtime DLLs (windows only)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $imports = & "C:\Program Files\LLVM\bin\llvm-readobj.exe" --coff-imports native/dist/x64/fr-whisper.exe | Select-String "Name:"
          $imports
          if ($imports -match "(?i)vcruntime|msvcp") { throw "fr-whisper.exe depends on the Visual C++ runtime" }

      # The commit the About box shows. Read by electron/ipc.js.
      - name: record build info
        run: echo "{\"commit\":\"$(git rev-parse --short HEAD)\"}" > electron/build-info.json

      - name: build installers
        run: npx electron-builder ${{ matrix.electron }} --publish never "-c.extraMetadata.version=${GITHUB_REF_NAME#v}"

      # Uploaded by release id, into the draft create-release made, rather
      # than looked up by tag name - a re-run would otherwise risk landing in
      # a second draft for the same tag. The latest*.yml files are what the
      # app's updater reads, and the .blockmap files let it download only
      # what changed.
      - name: upload to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          shopt -s nullglob
          for file in dist/*.AppImage dist/*.deb dist/*.rpm dist/*.exe dist/*.dmg dist/*.zip dist/*.blockmap dist/latest*.yml; do
            name=$(basename "$file")
            echo "Uploading $name"
            gh api --method POST \
              -H "Content-Type: application/octet-stream" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$name" \
              --input "$file" --silent
          done

  # The file the app's updater checks an update against before downloading
  # it: every installer's SHA-512, from all platforms' latest*.yml, signed
  # with the release key (the one the Tauri builds' updater used). See
  # electron/update-manifest.js.
  sign-update-manifest:
    needs: [create-release, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: fetch the update files from the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          mkdir -p manifest
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
            --jq '.[] | select(.name | test("^latest.*\\.yml$")) | "\(.id) \(.name)"' |
          while read -r id name; do
            gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "manifest/$name"
          done
          ls -la manifest

      - name: write and sign update-manifest.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          node scripts/update-manifest.js manifest
          # Tauri's own signer, since the key is in its format. Run with npx
          # rather than kept as a dependency - it's only a signing tool here.
          npx --yes @tauri-apps/cli@2.11.4 signer sign -p "" manifest/update-manifest.json
          ls -la manifest

      - name: upload the signed manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          for file in manifest/update-manifest.json manifest/update-manifest.json.sig; do
            gh api --method POST \
              -H "Content-Type: application/octet-stream" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$(basename "$file")" \
              --input "$file" --silent
          done

  # A tag's caches are worth ~2GB and are readable by exactly one thing: a
  # re-run of that same tag. Once every leg has passed there's nothing left
  # to retry, so they become dead weight competing for the repo's 10GB cache
  # budget - and the thing they evict is main's CI caches, which are used on
  # every single push. Four releases' worth had accumulated to 5.7GB before
  # this existed.
  #
  # Only runs when the whole matrix succeeded. A failed release keeps its
  # caches precisely so the retry is fast (see cache-on-failure above).
  cleanup-caches:
    needs: [release, sign-update-manifest]
    if: success()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: delete this tag's build caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Filtered locally, not with the API's ?ref= parameter - that
          # silently matches nothing for tags, because the refs it reports
          # back are mangled ("refs/heads/refs/tags/v1.1.0"), so a query for
          # "refs/tags/v1.1.0" returns an empty list and the job would
          # cheerfully report success having deleted nothing.
          ids=$(gh api "/repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" \
            --jq ".actions_caches[] | select(.ref | endswith(\"/$GITHUB_REF_NAME\")) | .id")
          if [ -z "$ids" ]; then
            echo "No caches scoped to $GITHUB_REF_NAME."
            exit 0
          fi
          for id in $ids; do
            echo "Deleting cache $id"
            gh api --method DELETE "/repos/$GITHUB_REPOSITORY/actions/caches/$id"
          done
          gh api "/repos/$GITHUB_REPOSITORY/actions/cache/usage" \
            --jq '"Remaining: \(.active_caches_size_in_bytes/1048576 | floor)MB across \(.active_caches_count) caches"'
