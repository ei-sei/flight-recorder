name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so newly-disclosed advisories are caught even with no code changes.
    - cron: "0 6 * * 1"

# Cheap to run, but there's no value in auditing a commit that's already been
# superseded - the run history had two of these fire for the same commit.
# The weekly scheduled run shares main's group (a schedule uses the default
# branch's ref), so a push can cancel it. That's fine: the push runs its own
# audit against newer code, which is strictly the more useful answer.
# Neither job writes anything back to the repository. Without this block they
# inherit the repository default, which on an older repo is read/write on
# contents - release.yml already scopes its own token per job.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # A prebuilt binary, not `cargo install cargo-audit --locked`. That
      # compiled cargo-audit and its whole dependency tree from source on every
      # run, and rust-cache is scoped to src-tauri so the result was never
      # reused - several minutes wasted on every push and every weekly run.
      - name: install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: cargo audit
        run: cargo audit --file src-tauri/Cargo.lock

  npm-audit:
    runs-on: ubuntu-22.04
    # npm's own retries can sit on an unreachable registry for five minutes
    # before giving up, which is most of this job's runtime when it happens.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      # npm audit exits 1 both for a real finding and for a registry that is
      # down, so the exit code alone cannot tell "you have a vulnerability"
      # apart from "npmjs.org returned a 503". Without this a third-party
      # outage fails the build and reads exactly like a security finding.
      # A real finding still fails on the first attempt; only an endpoint
      # error is retried.
      - name: npm audit
        run: |
          for attempt in 1 2 3; do
            if output=$(npm audit --audit-level=high 2>&1); then
              echo "$output"
              exit 0
            fi
            echo "$output"
            if ! grep -q "audit endpoint returned an error" <<<"$output"; then
              echo "::error::npm audit reported a vulnerability at or above the high threshold."
              exit 1
            fi
            echo "Registry error on attempt $attempt of 3; retrying in 20s."
            sleep 20
          done
          echo "::error::npm registry was unreachable after 3 attempts; audit did not run."
          exit 1
